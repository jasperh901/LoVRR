model:
  model_path: "models/LoVRR-7B"
  base_model_path: "models/Qwen2-VL-7B-Instruct"
  device: "auto"
  adapters:
    planner: "models/LoVRR-7B/planner"
    grounder: "models/LoVRR-7B/grounder"
    refiner: "models/LoVRR-7B/refiner"
    deepthinker: "models/LoVRR-7B/deepthinker"

inference:
  max_frames: 32
  max_new_tokens: 2048
  problem_type: "free-form"
  temperature: 0.1
  top_p: 0.001

refinement:
  refine_iters: 3
  budget: 32
  step_ratio: 0.2
  step_min: 1.0
  step_decay: 0.7
  skip_high: 0.85
  skip_low: 0.15
  gain: 0.01

server:
  host: "127.0.0.1"
  port: 8000
